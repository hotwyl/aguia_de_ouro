<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adivinhe a Palavra - Jogo Bíblico Educativo">
    <title>Adivinhe a Palavra | Jogos Bíblicos</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="flex flex-shrink-0 items-center">
                        <i class="fa-solid fa-book-bible text-primary-600 text-3xl"></i>
                        <span class="ml-2 text-xl font-bold tracking-tight text-gray-900 hidden sm:block">Jogos Bíblicos</span>
                    </a>
                </div>
                <nav class="hidden md:ml-6 md:flex md:space-x-8">
                    <a href="index.html" class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Início</a>
                    <a href="index.html#games" class="inline-flex items-center border-b-2 border-primary-500 px-1 pt-1 text-sm font-medium text-gray-900">Jogos</a>
                    
                </nav>
                <div class="flex items-center space-x-4">
                    <button onclick="app.showHelp('O objetivo do jogo é tentar descobrir qual é a palavra secreta a partir das dicas fornecidas. Clique nas letras do teclado virtual ou digite no seu teclado físico. Cuidado com o limite de erros!')" class="text-gray-400 hover:text-primary-600 transition-colors" title="Ajuda">
                        <i class="fa-solid fa-circle-question text-xl"></i>
                    </button>
                    <!-- Mobile menu button -->
                    <div class="flex items-center md:hidden">
                        <button type="button" id="mobile-menu-btn" class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-500" aria-controls="mobile-menu" aria-expanded="false">
                            <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile menu, show/hide based on menu state. -->
        <div class="hidden md:hidden" id="mobile-menu">
            <div class="space-y-1 pb-3 pt-2">
                <a href="index.html" class="block border-l-4 border-transparent py-2 pl-3 pr-4 text-base font-medium text-gray-500 hover:border-gray-300 hover:bg-gray-50 hover:text-gray-700">Início</a>
                <a href="index.html#games" class="block border-l-4 border-primary-500 bg-primary-50 py-2 pl-3 pr-4 text-base font-medium text-primary-700">Jogos</a>
                
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-4xl">
            <!-- Game Header -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-center mb-4 sm:mb-0">
                    <div class="w-12 h-12 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl mr-4">
                        <i class="fa-solid fa-puzzle-piece"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Adivinhe a Palavra</h1>
                        <p class="text-sm text-gray-500">Nível: <span id="game-level" class="font-semibold text-primary-600">Fácil</span></p>
                    </div>
                </div>
                <div class="flex space-x-6 text-center">
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Pontuação</p>
                        <p class="text-2xl font-bold text-gray-900" id="game-score">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Vidas</p>
                        <div class="text-2xl text-red-500 flex items-center space-x-1 mt-1" id="game-lives">
                            <!-- Hearts will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Board -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 lg:p-10 mb-6 text-center">
                <!-- Hint Array -->
                <div class="mb-10 bg-blue-50 border border-blue-100 rounded-lg p-4 inline-block mx-auto min-w-[50%]">
                    <span class="text-blue-800 font-semibold text-sm uppercase tracking-wider block mb-1">Dica:</span>
                    <p id="game-hint" class="text-lg text-blue-900 font-medium">Carregando dica...</p>
                </div>

                <!-- Word Display -->
                <div id="word-display" class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-12 min-h-[4rem]">
                    <!-- Letter boxes will be rendered here -->
                </div>

                <!-- Keyboard -->
                <div id="virtual-keyboard" class="max-w-3xl mx-auto flex flex-wrap justify-center gap-2">
                    <!-- Keys will be rendered here -->
                </div>
            </div>

            <!-- Game Actions -->
            <div class="flex justify-center space-x-4">
                <button id="btn-restart" class="rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Recomeçar
                </button>
                <button id="btn-hint" class="rounded-md bg-yellow-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-yellow-400 transition-colors" onclick="app.showNotice('Nenhuma dica extra disponível no nível fácil.')">
                    <i class="fa-solid fa-lightbulb mr-2"></i> Dica Extra (-10 pts)
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white mt-auto">
        <div class="mx-auto max-w-7xl px-4 py-6">
            <p class="text-center text-xs text-gray-400">
                &copy; <span id="current-year"></span> Jogos Bíblicos.
            </p>
        </div>
    </footer>

    <!-- App Scripts -->
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/games/adivinhe-a-palavra.js"></script>
</body>
</html>
