asse de Amigo?",opcoes:["O Desejado de Todas as Nações","Patriarcas e Profetas","Evangelismo","Vida de Jesus"],correta:3,curiosidade:"Cada classe tem livros: Amigo estuda Vida de Jesus e partes de O Desejado."},{id:22,nivel:"facil",pergunta:"O que o Desbravador deve fazer pela manhã segundo a Lei?",opcoes:["Correr 5km","Observar a devoção matinal","Arrumar a barraca","Cantar o hino"],correta:1,curiosidade:"1ª Lei: Observar a devoção matinal - tempo com Deus ao começar o dia."},{id:23,nivel:"facil",pergunta:"Qual especialidade é representada por uma fogueira?",opcoes:["Fogueiras e Cozinha ao Ar Livre","Acampamento I","Pioneirismo","Fogo"],correta:0,curiosidade:"Fogueiras e Cozinha ao Ar Livre ensina tipos de fogo, segurança e receitas."},{id:24,nivel:"facil",pergunta:'O que significa "Ser cortês e obediente"?',opcoes:["Falar bonito e obedecer aos pais e líderes","Só obedecer quando quer","Ser educado só na igreja","Obedecer só a Deus"],correta:0,curiosidade:"Cortesia e obediência aos pais, líderes e autoridades constituídas."},{id:25,nivel:"facil",pergunta:"Qual o dia oficial do Desbravador?",opcoes:["Primeiro sábado de março","Terceiro sábado de setembro","Dia Mundial dos Desbravadores - 3º sábado de setembro","Último sábado de setembro"],correta:2,curiosidade:"Dia Mundial dos Desbravadores é comemorado no terceiro sábado de setembro."},{id:26,nivel:"facil",pergunta:"Qual o símbolo de primeiros socorros?",opcoes:["Cruz Vermelha","Cruz Verde","Cruz Branca sobre fundo vermelho","Estrela da Vida"],correta:0,curiosidade:"Cruz Vermelha ou branca sobre vermelho é universal de socorro."},{id:27,nivel:"facil",pergunta:"O que é uma unidade?",opcoes:["Grupo de 6 a 8 desbravadores com capitão e secretário","Todo o clube","Só os diretores","Grupo de pais"],correta:0,curiosidade:"Unidade é a célula do clube: 6-8 membros, capitão, secretário, conselheiro."},{id:28,nivel:"facil",pergunta:"Qual cor de cordão usa o Guia?",opcoes:["Vermelho","Azul","Verde","Dourado"],correta:0,curiosidade:"Guia usa cordão vermelho - cor de liderança e sacrifício."},{id:29,nivel:"facil",pergunta:"O Hino dos Desbravadores começa com...",opcoes:["Desbravadores, valorosos...","Somos os Desbravadores, os servos de Deus...","Marchando com Jesus...","Avante Desbravador"],correta:1,curiosidade:'"Somos os desbravadores, os servos de Deus, herdeiros do reino..."'},{id:30,nivel:"facil",pergunta:"O que é a Ordem Unida?",opcoes:["Marcha e comandos para disciplina e ordem","Oração em conjunto","Fila para almoço","Organização de barracas"],correta:0,curiosidade:"Ordem Unida ensina disciplina, atenção, comandos de marcha."},{id:31,nivel:"facil",pergunta:"Qual nó não desmancha sob tensão?",opcoes:["Nó direito","Lais de Guia","Nó de escota","Nó simples"],correta:1,curiosidade:"Lais de Guia forma alça fixa que não corre - salva vidas."},{id:32,nivel:"facil",pergunta:'O que significa "Guardar uma canção no coração"?',opcoes:["Estar alegre e cantar mesmo nas dificuldades","Só cantar na igreja","Decorar 100 músicas","Cantar alto"],correta:0,curiosidade:"É manter alegria cristã, louvor interno mesmo em provações."},{id:33,nivel:"facil",pergunta:"Qual a cor da bandeira da classe de Amigo?",opcoes:["Azul","Vermelho","Verde","Amarela"],correta:0,curiosidade:"Amigo = azul claro, Companheiro = vermelho, Pesquisador = verde, etc."},{id:34,nivel:"facil",pergunta:"O que é o bastão do Desbravador?",opcoes:["Cajado de madeira com símbolos","Vara de pescar","Bengala","Bastão de corrida"],correta:0,curiosidade:"Bastão de 1,50m usado em ordem unida e pioneirismo."},{id:35,nivel:"facil",pergunta:"Qual especialidade ensina estrelas?",opcoes:["Astronomia","Estrelas","Orientação por estrelas","Estrelas e Constelações"],correta:1,curiosidade:"Especialidade de Estrelas identifica constelações e planetas."},{id:36,nivel:"facil",pergunta:"Quem deve participar da devoção matinal?",opcoes:["Só o diretor","Todos os desbravadores","Só os batizados","Só os guias"],correta:1,curiosidade:"Devocional é para todo
