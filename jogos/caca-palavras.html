<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Caça Palavras - Jogos Bíblicos">
    <title>Caça Palavras | Jogos Bíblicos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/assets/css/app.css">
    <style>
        /* Word search specific selection styles */
        .ws-cell {
            user-select: none;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .ws-cell.selected {
            background-color: #dbeafe; /* primary-100 */
            color: #1e40af; /* primary-800 */
            font-weight: 700;
            border-radius: 4px;
        }
        .ws-cell.found {
            background-color: #dcfce7; /* green-100 */
            color: #166534; /* green-800 */
            font-weight: 700;
            border-radius: 4px;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #9ca3af; /* text-gray-400 */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="flex flex-shrink-0 items-center">
                        <i class="fa-solid fa-book-bible text-primary-600 text-3xl"></i>
                        <span class="ml-2 text-xl font-bold tracking-tight text-gray-900 hidden sm:block">Jogos Bíblicos</span>
                    </a>
                </div>
                <nav class="hidden md:ml-6 md:flex md:space-x-8">
                    <a href="index.html" class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700">Início</a>
                    <a href="index.html#games" class="inline-flex items-center border-b-2 border-primary-500 px-1 pt-1 text-sm font-medium text-gray-900">Jogos</a>
                    
                </nav>
                <div class="flex items-center space-x-4">
                    <button onclick="app.showHelp('Encontre todas as palavras listadas na grade. Clique e arraste para selecionar. Elas podem estar na horizontal, vertical ou diagonal!')" class="text-gray-400 hover:text-primary-600 transition-colors" title="Ajuda">
                        <i class="fa-solid fa-circle-question text-xl"></i>
                    </button>
                    <!-- Mobile menu button -->
                    <div class="flex items-center md:hidden">
                        <button type="button" id="mobile-menu-btn" class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-500" aria-controls="mobile-menu" aria-expanded="false">
                            <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile menu, show/hide based on menu state. -->
        <div class="hidden md:hidden" id="mobile-menu">
            <div class="space-y-1 pb-3 pt-2">
                <a href="index.html" class="block border-l-4 border-transparent py-2 pl-3 pr-4 text-base font-medium text-gray-500 hover:border-gray-300 hover:bg-gray-50 hover:text-gray-700">Início</a>
                <a href="index.html#games" class="block border-l-4 border-primary-500 bg-primary-50 py-2 pl-3 pr-4 text-base font-medium text-primary-700">Jogos</a>
                
            </div>
        </div>
    </header>

    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-5xl">
            <!-- Game Header -->
            <div class="flex flex-col md:flex-row justify-between items-center bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-center mb-4 md:mb-0">
                    <div class="w-12 h-12 rounded-lg bg-green-100 text-green-600 flex items-center justify-center text-2xl mr-4">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Caça Palavras</h1>
                        <p class="text-sm text-gray-500">Encontradas: <span id="game-progress" class="font-semibold text-green-600">0/5</span></p>
                    </div>
                </div>
                <div class="flex space-x-4">
                    <button id="btn-restart" class="rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Recomeçar
                    </button>
                    <button onclick="app.showNotice('Selecione as letras clicando e arrastando formndo as palavras.')" class="rounded-md bg-green-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-green-500 transition-colors">
                        Ler Dica
                    </button>
                </div>
            </div>

            <!-- Game Space: Grid & Word List -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Grid -->
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 flex justify-center items-center overflow-x-auto touch-none">
                    <div id="ws-grid" class="grid gap-1 bg-gray-50 p-2 sm:p-4 rounded-lg font-mono text-lg sm:text-xl font-bold text-gray-600 text-center select-none" style="grid-template-columns: repeat(12, minmax(0, 1fr)); width:max-content; margin: auto;">
                        <!-- Cells rendered dynamically -->
                    </div>
                </div>

                <!-- Word List -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2"><i class="fa-solid fa-list-check mr-2 text-gray-400"></i>Palavras Ocultas</h3>
                    <ul id="word-list" class="space-y-2 text-gray-700 font-medium">
                        <!-- Words rendered here -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white mt-auto">
        <div class="mx-auto max-w-7xl px-4 py-6">
            <p class="text-center text-xs text-gray-400">
                &copy; <span id="current-year"></span> Jogos Bíblicos.
            </p>
        </div>
    </footer>

    <!-- App Scripts -->
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/games/caca-palavras.js"></script>
</body>
</html>
