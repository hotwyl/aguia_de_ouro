<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo da Forca - Jogos Bíblicos Educativos">
    <title>Jogo da Forca | Jogos Bíblicos</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="flex flex-col min-h-screen" style="background:#0D1117;color:#F5F0E8;">
    <!-- Header -->
    <header style="position:sticky;top:0;z-index:50;background:rgba(13,17,23,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(201,168,76,0.15);">
        <div style="max-width:1200px;margin:0 auto;padding:0 16px;display:flex;height:56px;align-items:center;justify-content:space-between;">
            <a href="/jogos/index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B6914,#C9A84C);"><i class="fas fa-feather-alt" style="color:#0D1117;font-size:13px;"></i></div>
                <span style="font-size:14px;font-weight:700;color:#C9A84C;font-family:'Cinzel',serif;">Águia de Ouro</span>
            </a>
            <nav style="display:flex;align-items:center;gap:4px;">
                <a href="/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-home" style="margin-right:4px"></i>Início</a>
                <a href="/jogos/index.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#C9A84C;text-decoration:none;border-radius:6px;"><i class="fas fa-gamepad" style="margin-right:4px"></i>Jogos</a>
                <a href="/guia.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-book-open" style="margin-right:4px"></i>Guia</a>
                <a href="/quiz.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-dove" style="margin-right:4px"></i>Aves</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-4xl">
            <!-- Game Header -->
            <div class="flex flex-col sm:flex-row justify-between items-center bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-center mb-4 sm:mb-0">
                    <div class="w-12 h-12 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mr-4">
                        <i class="fa-solid fa-user-xmark"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Jogo da Forca</h1>
                    </div>
                </div>
                <div class="flex space-x-6 text-center">
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Erros</p>
                        <p class="text-2xl font-bold text-red-500"><span id="game-errors">0</span> / 6</p>
                    </div>
                </div>
            </div>

            <!-- Game Board -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 lg:p-10 mb-6 text-center grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                
                <!-- Hangman Canvas/SVG -->
                <div class="flex justify-center border-b md:border-b-0 md:border-r border-gray-200 pb-8 md:pb-0">
                    <svg height="250" width="200" class="stroke-current text-gray-800 stroke-[4] fill-transparent">
                        <!-- Forca -->
                        <line x1="20" y1="240" x2="100" y2="240" />
                        <line x1="60" y1="240" x2="60" y2="20" />
                        <line x1="60" y1="20" x2="140" y2="20" />
                        <line x1="140" y1="20" x2="140" y2="50" />
                        
                        <!-- Partes do Corpo (Escondidas inicialmente) -->
                        <circle id="part-0" cx="140" cy="70" r="20" class="hidden text-orange-500" /> <!-- Cabeça -->
                        <line id="part-1" x1="140" y1="90" x2="140" y2="150" class="hidden text-orange-500" /> <!-- Corpo -->
                        <line id="part-2" x1="140" y1="100" x2="120" y2="130" class="hidden text-orange-500" /> <!-- Braço Esq -->
                        <line id="part-3" x1="140" y1="100" x2="160" y2="130" class="hidden text-orange-500" /> <!-- Braço Dir -->
                        <line id="part-4" x1="140" y1="150" x2="120" y2="190" class="hidden text-orange-500" /> <!-- Perna Esq -->
                        <line id="part-5" x1="140" y1="150" x2="160" y2="190" class="hidden text-orange-500" /> <!-- Perna Dir -->
                    </svg>
                </div>

                <!-- Word & Keyboard -->
                <div>
                    <!-- Hint -->
                    <div class="mb-6 bg-blue-50 border border-blue-100 rounded-lg p-4 inline-block w-full">
                        <span class="text-blue-800 font-semibold text-sm uppercase tracking-wider block mb-1">Dica:</span>
                        <p id="game-hint" class="text-sm sm:text-base text-blue-900 font-medium">Carregando dica...</p>
                    </div>

                    <!-- Word Display -->
                    <div id="word-display" class="flex flex-wrap justify-center gap-1 sm:gap-2 mb-8 min-h-[3rem]">
                        <!-- Letters here -->
                    </div>

                    <!-- Keyboard -->
                    <div id="virtual-keyboard" class="flex flex-wrap justify-center gap-1 sm:gap-2">
                        <!-- Keys here -->
                    </div>
                </div>
            </div>

            <!-- Game Actions -->
            <div class="flex justify-center space-x-4">
                <button id="btn-restart" class="rounded-md bg-white px-4 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Recomeçar
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background:#0D1117;border-top:1px solid rgba(201,168,76,0.15);padding:16px;text-align:center;margin-top:auto;">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:8px;">
        <a href="/" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Início</a>
        <span style="color:#4B5563;">·</span>
        <a href="/jogos/index.html" style="font-size:11px;color:#C9A84C;text-decoration:none;">Jogos</a>
        <span style="color:#4B5563;">·</span>
        <a href="/guia.html" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Guia</a>
        <span style="color:#4B5563;">·</span>
        <a href="/quiz.html" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Aves</a>
      </div>
      <p style="font-size:10px;color:#6B7280;">© 2025 Águia de Ouro · <strong style="color:#C9A84C;">HOTWYL | WILLFROMBRASIL</strong></p>
    </footer>

    <!-- App Scripts -->
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/games/forca.js"></script>
</body>
</html>
