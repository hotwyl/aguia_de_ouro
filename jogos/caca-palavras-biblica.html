<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Caça Palavras - Jogos Bíblicos">
    <title>Caça Palavras | Jogos Bíblicos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/assets/css/app.css">
    <style>
        /* Word search specific selection styles */
        .ws-cell {
            user-select: none;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .ws-cell.selected {
            background-color: #dbeafe; /* primary-100 */
            color: #1e40af; /* primary-800 */
            font-weight: 700;
            border-radius: 4px;
        }
        .ws-cell.found {
            background-color: #dcfce7; /* green-100 */
            color: #166534; /* green-800 */
            font-weight: 700;
            border-radius: 4px;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #9ca3af; /* text-gray-400 */
        }
    </style>
</head>
<body class="flex flex-col min-h-screen" style="background:#0D1117;color:#F5F0E8;">
    <!-- Header -->
    <header style="position:sticky;top:0;z-index:50;background:rgba(13,17,23,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(201,168,76,0.15);">
        <div style="max-width:1200px;margin:0 auto;padding:0 16px;display:flex;height:56px;align-items:center;justify-content:space-between;">
            <a href="/jogos/index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B6914,#C9A84C);"><i class="fas fa-feather-alt" style="color:#0D1117;font-size:13px;"></i></div>
                <span style="font-size:14px;font-weight:700;color:#C9A84C;font-family:'Cinzel',serif;">Águia de Ouro</span>
            </a>
            <nav style="display:flex;align-items:center;gap:4px;">
                <a href="/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-home" style="margin-right:4px"></i>Início</a>
                <a href="/jogos/index.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#C9A84C;text-decoration:none;border-radius:6px;"><i class="fas fa-gamepad" style="margin-right:4px"></i>Jogos</a>
                <a href="/guia.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-book-open" style="margin-right:4px"></i>Guia</a>
                <a href="/quiz.html" style="padding:6px 10px;font-size:12px;font-weight:500;color:#9CA3AF;text-decoration:none;border-radius:6px;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'"><i class="fas fa-dove" style="margin-right:4px"></i>Aves</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-5xl">
            <!-- Game Header -->
            <div class="flex flex-col md:flex-row justify-between items-center bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-center mb-4 md:mb-0">
                    <div class="w-12 h-12 rounded-lg bg-green-100 text-green-600 flex items-center justify-center text-2xl mr-4">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Caça Palavras</h1>
                        <p class="text-sm text-gray-500">Encontradas: <span id="game-progress" class="font-semibold text-green-600">0/5</span></p>
                    </div>
                </div>
                <div class="flex space-x-4">
                    <button id="btn-restart" class="rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Recomeçar
                    </button>
                    <button onclick="app.showNotice('Selecione as letras clicando e arrastando formndo as palavras.')" class="rounded-md bg-green-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-green-500 transition-colors">
                        Ler Dica
                    </button>
                </div>
            </div>

            <!-- Game Space: Grid & Word List -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Grid -->
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-6 flex justify-center items-center overflow-x-auto touch-none">
                    <div id="ws-grid" class="grid gap-1 bg-gray-50 p-2 sm:p-4 rounded-lg font-mono text-lg sm:text-xl font-bold text-gray-600 text-center select-none" style="grid-template-columns: repeat(12, minmax(0, 1fr)); width:max-content; margin: auto;">
                        <!-- Cells rendered dynamically -->
                    </div>
                </div>

                <!-- Word List -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2"><i class="fa-solid fa-list-check mr-2 text-gray-400"></i>Palavras Ocultas</h3>
                    <ul id="word-list" class="space-y-2 text-gray-700 font-medium">
                        <!-- Words rendered here -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background:#0D1117;border-top:1px solid rgba(201,168,76,0.15);padding:16px;text-align:center;margin-top:auto;">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:8px;">
        <a href="/" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Início</a>
        <span style="color:#4B5563;">·</span>
        <a href="/jogos/index.html" style="font-size:11px;color:#C9A84C;text-decoration:none;">Jogos</a>
        <span style="color:#4B5563;">·</span>
        <a href="/guia.html" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Guia</a>
        <span style="color:#4B5563;">·</span>
        <a href="/quiz.html" style="font-size:11px;color:#9CA3AF;text-decoration:none;" onmouseover="this.style.color='#C9A84C'" onmouseout="this.style.color='#9CA3AF'">Aves</a>
      </div>
      <p style="font-size:10px;color:#6B7280;">© 2025 Águia de Ouro · <strong style="color:#C9A84C;">HOTWYL | WILLFROMBRASIL</strong></p>
    </footer>

    <!-- App Scripts -->
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/games/caca-palavras.js"></script>
</body>
</html>
