on Scouts","D) Boys Club","E) Pioneers"],correta:2,curiosidade:"Spalding organizou os Mission Scouts em 1907, embrião do que viria a ser os Desbravadores."},{id:4,tema:"História",pergunta:"Quem foi Henry Bergh no início dos clubes?",opcoes:["A) Primeiro diretor mundial","B) Criador do lenço","C) Líder dos Boy Scouts que inspirou a igreja","D) Autor do primeiro livro de classes","E) Presidente da Associação Geral"],correta:2,curiosidade:"Henry Bergh organizou clubes de escoteiros adventistas e influenciou a criação dos Mission Volunteers."},{id:5,tema:"História",pergunta:"Em 1922 surgiu a organização JMV. O que significa?",opcoes:["A) Jovens Missionários Voluntários","B) Juventude Missionária Vitoriosa","C) Jovens Modelos de Virtude","D) Jovens Ministros Voluntários","E) Jovens Mensageiros da Verdade"],correta:0,curiosidade:"JMV - Jovens Missionários Voluntários era a estrutura que antecedeu os Desbravadores."},{id:6,tema:"História",pergunta:"Onde e quando aconteceu o primeiro Campori de Desbravadores da história?",opcoes:["A) 1954 em Idyllwild, Califórnia","B) 1950 em Washington","C) 1960 no Texas","D) 1946 em Michigan","E) 1952 na Flórida"],correta:0,curiosidade:"Idyllwild em 1954 reuniu 12 clubes. Foi o primeiro Campori."},{id:7,tema:"História",pergunta:"Quem foi a primeira diretora de Desbravadores da Divisão Sul-Americana, em Lima, 1955?",opcoes:["A) Nercida Ruiz","B) Erica Muler","C) Maria Lessa","D) Ruth Scharch","E) Clara López"],correta:0,curiosidade:"Nercida Ruiz liderou o primeiro clube sul-americano em Lima, Peru, em 1955."},{id:8,tema:"História",pergunta:"Quando e onde surgiu o primeiro clube de Desbravadores no Brasil?",opcoes:["A) 1959 em Capinzal, SC","B) 1955 em São Paulo, SP","C) 1962 em Curitiba, PR","D) 1960 no Rio de Janeiro","E) 1958 em Porto Alegre"],correta:0,curiosidade:"Capinzal, Santa Catarina, em 1959, com apoio do pastor E. W. Rogers."},{id:9,tema:"História",pergunta:"Qual foi o nome do primeiro Campori Sul-Americano?",opcoes:["A) Campori da Fé","B) Campori de 1983 - Araxá MG","C) Campori do Centenário","D) Campori Conquista","E) Campori da Esperança"],correta:1,curiosidade:"O I Campori DSA foi em Araxá, Minas Gerais, em 1983, com tema 'Juventude em Marcha'."},{id:10,tema:"História",pergunta:"O que significa a sigla JMC que existiu antes dos Desbravadores?",opcoes:["A) Jovens Missionários Corajosos","B) Junior Missionary Volunteers","C) Jovens Mensageiros de Cristo","D) Juventude Missionária Cristã","E) Jovens do Ministério da Criança"],correta:1,curiosidade:"JMV para jovens e JMC (Junior) para crianças menores."},{id:11,tema:"História",pergunta:"Quem desenhou o emblema oficial triangular dos Desbravadores?",opcoes:["A) John Hancock e Francis Hunt","B) Henry Bergh","C) Arthur Spalding","D) Ellen White","E) Lester Bond"],correta:0,curiosidade:"John Hancock com Francis Hunt desenharam o escudo triangular em 1950."},{id:12,tema:"História",pergunta:"Qual acampamento de 1928 em San Gabriel é considerado o embrião do Campori?",opcoes:["A) Acampamento JMV de San Gabriel","B) Acampamento de Yellowstone","C) Acampamento de Michigan","D) Acampamento White Memorial","E) Acampamento de Glendale"],correta:0,curiosidade:"Liderado por John McKim e Wirt Wilis, reuniu jovens para atividades ao ar livre."},{id:13,tema:"História",pergunta:"Em que ano o Clube de Desbravadores chegou oficialmente à Europa?",opcoes:["A) 1951","B) 1955","C) 1960","D) 1963","E) 1970"],correta:1,curiosidade:"Em 1955 o movimento se expandiu rapidamente após a oficialização."},{id:14,tema:"História",pergunta:"O primeiro clube em Santa Ana, Califórnia, foi dirigido por quem em 1930?",opcoes:["A) John Hancock","B) Guy Mann e E.W. Rogers","C) Arthur Spalding","D) Lester Bond","E) Henry Bergh"],correta:1,curiosidade:"Guy Mann e sua esposa organizam clube em Santa Ana, mantido por 7 anos."},{id:15,tema:"História",pergunta:"Qual foi o tema do Campori Internacional de Oshkosh 2019?",opcoes:["A) Escolhidos","B) Coragem para Ficar de Pé","C) Chosen","D) Fé dos Nossos Pais","E) Marcados para Eternidade"],correta:2,curiosidade:"Chosen reuniu mais de 50 mil desbravadores em Wisconsin."},{id:16,tema:"História",pergunta:"O que acontecia nos clubes MV nos anos 40 antes do nome Desbravadores?",opcoes:["A) Apenas estudos bíblicos","B) Classes progressivas, acampamentos e honras","C) Só marchas","D) Apenas esportes","E) Só música"],correta:1,curiosidade:"Já existiam classes, especialidades e acampamentos que formaram a base do clube moderno."},{id:17,tema:"História",pergunta:"Qual associação adotou oficialmente os Desbravadores em 1950?",opcoes:["A) Associação Geral dos Adventistas","B) Associação da Califórnia","C) Associação de Michigan","D) Associação Sul-Americana","E) Associação da Flórida"],correta:0,curiosidade:"A Associação Geral deu reconhecimento mundial e manual oficial."},{id:18,tema:"História",pergunta:"Quem escreveu a primeira versão do Manual dos Desbravadores?",opcoes:["A) John Hancock e Helen Hobbs","B) Ellen White","C) Arthur Spalding","D) Lester Bond","E) Henry Bergh"],correta:0,curiosidade:"Helen Hobbs ajudou Hancock a organizar o primeiro manual em 1951."},{id:19,tema:"História",pergunta:"O Campori da DSA de 2014 em Barretos teve qual tema?",opcoes:["A) Encontro Marcado na Eternidade","B) Geração de Esperança","C) Escolhidos para Vencer","D) Viva com Esperança","E) Conquistadores de Cristo"],correta:0,curiosidade:"Barretos 2014 marcou a geração com o tema Encontro Marcado na Eternidade."},{id:20,tema:"História",pergunta:"Em 1907, Ellen White sugeriu acampamentos para jovens em que livro?",opcoes:["A) Mensagens aos Jovens","B) Educação","C) Conselhos aos Pais","D) Lar Adventista","E) O Desejado de Todas as Nações"],correta:0,curiosidade:"Ela incentivou atividades ao ar livre para fortalecer a espiritualidade jovem."},{id:21,tema:"Filosofia",pergunta:"Qual é a filosofia oficial do Clube de Desbravadores?",opcoes:["A) Salvar do pecado e guiar no serviço","B) Formar líderes para o mundo","C) Ensinar sobrevivência na selva","D) Preparar soldados","E) Entreter jovens nos sábados"],correta:0,curiosidade:"A filosofia é salvar do pecado e guiar no serviço – evangelismo e serviço."},{id:22,tema:"Filosofia",pergunta:"O que significa a frase 'Jovens pelos Jovens'?",opcoes:["A) Jovens evangelizam jovens","B) Jovens brigam entre si","C) Jovens mandam nos adultos","D) Jovens só andam com jovens","E) Jovens competem com jovens"],correta:0,curiosidade:"O clube é conduzido por jovens para alcançar outros jovens."},{id:23,tema:"Filosofia",pergunta:"Qual o propósito do clube em relação ao desenvolvimento?",opcoes:["A) Físico, mental e espiritual","B) Só físico","C) Só espiritual","D) Só social","E) Financeiro e acadêmico"],correta:0,curiosidade:"Desenvolvimento integral: físico, mental, espiritual e social."},{id:24,tema:"Filosofia",pergunta:"Por que o clube usa a natureza como sala de aula?",opcoes:["A) Porque Deus criou a natureza e ela ensina sobre Ele","B) Porque não tem prédio","C) Porque é mais barato","D) Porque Ellen White gostava","E) Porque é moda"],correta:0,curiosidade:"A natureza é o segundo livro de Deus, ensina lições espirituais."},{id:25,tema:"Filosofia",pergunta:"Qual é o papel do desbravador na igreja?",opcoes:["A) Ser missionário ativo e exemplo","B) Apenas frequentar","C) Tocar bateria","D) Vender livros","E) Limpar o pátio"],correta:0,curiosidade:"O desbravador é chamado a ser missionário e testemunho vivo."},{id:26,tema:"Filosofia",pergunta:"O que significa desenvolver liderança servidora?",opcoes:["A) Liderar servindo como Jesus","B) Mandar nos outros","C) Servir só os amigos","D) Não liderar","E) Ser servo sem liderar"],correta:0,curiosidade:"Liderança desbravadora é servir primeiro, como Cristo."},{id:27,tema:"Filosofia",pergunta:"O clube de Desbravadores é para que faixa etária oficial?",opcoes:["A) 6 a 9 anos","B) 10 a 15 anos","C) 16 a 30 anos","D) 10 a 18 anos","E) 8 a 12 anos"],correta:1,curiosidade:"Oficialmente 10-15, mas muitos lugares aceitam até 16 ou 18 até virar líder."},{id:28,tema:"Filosofia",pergunta:"Qual é o lema da filosofia 'Salvar do pecado e guiar no serviço' implica em 3 pontos?",opcoes:["A) Salvação, serviço e testemunho","B) Dinheiro, fama e poder","C) Estudo, jogo e sono","D) Comida, acampamento e risada","E) Música, arte e esporte"],correta:0,curiosidade:"Salvar, guiar, servir – evangelismo prático."},{id:29,tema:"Filosofia",pergunta:"Como o clube entende disciplina?",opcoes:["A) Como treinamento de caráter com amor","B) Como punição severa","C) Como gritar","D) Como expulsar","E) Como ignorar"],correta:0,curiosidade:"Disciplina é discipulado, com amor e firmeza para formar caráter."},{id:30,tema:"Filosofia",pergunta:"Por que o uniforme é importante na filosofia?",opcoes:["A) Traz identidade, igualdade e pertencimento","B) Só para ficar bonito","C) Para competir","D) Para vender","E) Não é importante"],correta:0,curiosidade:"Uniforme iguala todos e cria senso de missão."},{id:31,tema:"Filosofia",pergunta:"Qual documento baseia a filosofia dos Desbravadores?",opcoes:["A) Bíblia e Espírito de Profecia","B) Manual escoteiro apenas","C) Constituição brasileira","D) Regras da ONU","E) Código de conduta militar"],correta:0,curiosidade:"Bíblia e escritos de Ellen White sustentam a filosofia."},{id:32,tema:"Filosofia",pergunta:"O que significa 'Desbravar' no nome?",opcoes:["A) Abrir caminhos onde não há, desbravar para Cristo","B) Destruir mato","C) Fazer trilha","D) Caçar","E) Explorar ouro"],correta:0,curiosidade:"Desbravar é abrir picadas espirituais e físicas para o evangelho."},{id:33,tema:"Filosofia",pergunta:"Qual a relação entre Desbravadores e Aventureiros?",opcoes:["A) Aventureiros são pré-desbravadores (6-9 anos)","B) São concorrentes","C) São a mesma coisa","D) Aventureiros são mais velhos","E) Não tem relação"],correta:0,curiosidade:"Aventureiros preparam crianças para entrarem nos Desbravadores."},{id:34,tema:"Filosofia",pergunta:"O que é desenvolvimento equilibrado?",opcoes:["A) Cres
